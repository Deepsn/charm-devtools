name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect release tag
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REF_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin
          tag=""
          if [ -n "$REF_NAME" ] && tag_sha="$(git rev-parse -q --verify "refs/tags/$REF_NAME^{commit}")" && [ "$tag_sha" = "$SHA" ]; then
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-<none>}"

      - name: Download build artifacts
        if: steps.tag.outputs.tag != ''
        uses: actions/download-artifact@v8
        with:
          name: charm-devtools
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/plugin.rbxm
            dist/rbxts-charm-devtools.tgz

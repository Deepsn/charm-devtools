name: Build

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rokit (rojo)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pack package
        run: |
          bun run package
          mkdir -p dist
          mv rbxts-charm-devtools-*.tgz dist/

      - name: Build plugin
        run: bun run --filter charm-devtools-plugin build

      - name: Build plugin.rbxm
        working-directory: plugin
        run: rojo build default.project.json -o ../dist/plugin.rbxm

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: charm-devtools
          path: |
            dist/plugin.rbxm
            dist/rbxts-charm-devtools-*.tgz
          if-no-files-found: error
